<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI v2 文字优先流程预览</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2928;
      --muted: #66736f;
      --line: #d9e2e0;
      --paper: #ffffff;
      --canvas: #f4f7f6;
      --green: #087f73;
      --green-dark: #05665d;
      --mint: #e2f2ef;
      --amber: #b8792c;
      --amber-soft: #f8ecda;
      --danger: #a33f37;
      --danger-soft: #fae9e7;
      --blue: #376b8d;
      --blue-soft: #e8f0f5;
      --shadow: 0 4px 18px rgba(18, 69, 63, .08);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--canvas); }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; }
    button:focus-visible, summary:focus-visible { outline: 3px solid rgba(8, 127, 115, .22); outline-offset: 2px; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 28px;
      color: #eff8f6;
      background: #1d2928;
      border-bottom: 1px solid #334441;
    }
    .brand { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: var(--green); font-family: Georgia, serif; font-size: 19px; }
    .brand strong, .brand small { display: block; }
    .brand strong { font-size: 14px; }
    .brand small { margin-top: 2px; color: #92aaa5; font-size: 8px; }
    .preview-badge { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; color: #c8d8d4; font-size: 11px; }
    .preview-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #e8bb70; }

    .shell { width: min(1440px, 100%); margin: 0 auto; padding: 26px 28px 56px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    .eyebrow { color: var(--amber); font-size: 10px; font-weight: 800; }
    h1 { margin: 6px 0 5px; font: 600 27px/1.25 Georgia, "Songti SC", serif; }
    .page-heading p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .zero-network { padding: 7px 10px; border: 1px solid #b9d3cc; border-radius: 7px; color: var(--green-dark); background: var(--mint); font-size: 10px; white-space: nowrap; }

    .workspace { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 18px; align-items: start; }
    .sidebar { position: sticky; top: 86px; display: grid; gap: 18px; }
    .sidebar-section { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .sidebar-section:last-child { padding-bottom: 0; border-bottom: 0; }
    .sidebar h2 { margin: 0 0 10px; font-size: 11px; }
    .sidebar p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .surface { padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: var(--shadow); }

    .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: #f1f5f4; }
    .segmented button { min-height: 34px; padding: 7px 9px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 700; }
    .segmented button.active { color: #fff; background: var(--green); }
    .segmented.submode { margin-top: 8px; background: #fff; }
    .segmented.submode button.active { color: var(--green-dark); background: var(--mint); }
    .segmented.outcome button.active[data-outcome="failure"] { color: var(--danger); background: var(--danger-soft); }
    .label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 9px; font-weight: 800; }

    .brief-list, .status-list { display: grid; gap: 8px; }
    .brief-row, .status-row { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; line-height: 1.45; }
    .brief-row span, .status-row span { color: var(--muted); }
    .brief-row strong, .status-row strong { text-align: right; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tag-list span { padding: 4px 6px; border-radius: 5px; color: var(--green-dark); background: var(--mint); font-size: 9px; }
    .reset-button { width: 100%; min-height: 34px; margin-top: 12px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: #fff; font-size: 10px; }
    .reset-button:hover { color: var(--ink); background: #f7f9f8; }

    .isolation { border-left: 3px solid var(--green); padding-left: 11px; }
    .isolation strong { display: block; margin-bottom: 4px; font-size: 11px; }

    .main { min-width: 0; }
    .results-header { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 12px; padding: 0 2px 12px; border-bottom: 1px solid var(--line); }
    .results-header h2 { margin: 0; font: 600 20px/1.3 Georgia, "Songti SC", serif; }
    .results-header p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .result-count { flex: 0 0 auto; color: var(--green-dark); font-size: 10px; font-weight: 800; }
    .results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .results.narrative-results { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .result-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: 0 2px 10px rgba(18, 69, 63, .045); }
    .card-head { padding: 15px 16px 12px; border-bottom: 1px solid #e8eeec; }
    .card-kicker { color: var(--amber); font-size: 9px; font-weight: 800; }
    .card-head h3 { margin: 6px 0 0; font: 600 16px/1.4 Georgia, "Songti SC", serif; }
    .card-body { padding: 14px 16px 16px; }
    .field { margin-top: 13px; }
    .field:first-child { margin-top: 0; }
    .field dt { margin-bottom: 4px; color: var(--muted); font-size: 9px; font-weight: 800; }
    .field dd { margin: 0; color: #35423f; font-size: 11px; line-height: 1.7; overflow-wrap: anywhere; }
    .ad-copy { padding: 9px 10px; border-left: 3px solid #e0b36e; background: #fbf6ed; }

    .hook { padding: 13px 0; border-top: 1px solid #e8eeec; }
    .hook:first-child { padding-top: 0; border-top: 0; }
    .hook strong { display: block; font-size: 11px; line-height: 1.55; }
    .scene-list { display: grid; gap: 7px; margin: 9px 0 0; padding: 0; list-style: none; counter-reset: scene; }
    .scene-list li { position: relative; min-height: 25px; padding-left: 29px; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .scene-list li::before { counter-increment: scene; content: counter(scene); position: absolute; left: 0; top: 0; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; color: var(--green-dark); background: var(--mint); font-size: 8px; font-weight: 800; }

    .image-zone { border-top: 1px solid var(--line); background: #f8faf9; }
    .image-placeholder { min-height: 132px; display: grid; place-items: center; padding: 18px; text-align: center; }
    .image-placeholder p { margin: 6px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .image-placeholder strong { font-size: 11px; }
    .placeholder-icon { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #bfd4ce; border-radius: 8px; color: var(--green); background: var(--mint); font-size: 16px; }
    .image-actions { padding: 0 14px 14px; }
    .action-button { width: 100%; min-height: 38px; padding: 8px 12px; border: 0; border-radius: 7px; color: #fff; background: var(--green); font-size: 11px; font-weight: 750; }
    .action-button:hover { background: var(--green-dark); }
    .action-button:disabled { color: #83918d; background: #e3e8e6; }
    .action-button.retry { color: var(--danger); border: 1px solid #e3bbb6; background: #fff; }
    .action-button.locked { color: var(--green-dark); background: var(--mint); }
    .spinner { width: 24px; height: 24px; border: 2px solid #b7ccc6; border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .simulated-art { position: relative; min-height: 158px; overflow: hidden; background: var(--art-bg, #dce9e5); }
    .simulated-art::before { content: ""; position: absolute; width: 42%; height: 72%; right: 8%; bottom: 0; border-radius: 8px 8px 0 0; background: var(--art-object, #0d6e64); }
    .simulated-art::after { content: ""; position: absolute; width: 26%; aspect-ratio: 1; right: 16%; top: 17%; border: 5px solid rgba(255,255,255,.8); border-radius: 50%; }
    .art-copy { position: absolute; z-index: 2; left: 15px; top: 16px; width: 47%; color: var(--art-ink, #203a35); font: 700 15px/1.35 Georgia, "Songti SC", serif; }
    .art-copy small { display: block; margin-top: 8px; font: 600 8px/1.45 Inter, sans-serif; }
    .lock-label { position: absolute; z-index: 3; right: 8px; bottom: 8px; padding: 4px 6px; border-radius: 5px; color: #fff; background: rgba(29,41,40,.82); font-size: 8px; }

    .frame-list { display: grid; gap: 0; }
    .frame-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 12px 0; border-top: 1px solid #e8eeec; }
    .frame-row:first-child { padding-top: 0; border-top: 0; }
    .frame-index { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--green-dark); background: var(--mint); font-size: 9px; font-weight: 800; }
    .frame-row p { margin: 0; color: #41504c; font-size: 10px; line-height: 1.55; }
    .frame-state { min-width: 44px; padding-top: 3px; color: #899591; font-size: 8px; text-align: right; }
    .frame-state.success { color: var(--green); }
    .frame-state.failed { color: var(--danger); }
    .frame-thumb { grid-column: 2 / 4; min-height: 54px; position: relative; overflow: hidden; margin-top: 1px; border-radius: 6px; background: var(--art-bg, #dce9e5); }
    .frame-thumb::after { content: ""; position: absolute; right: 10%; bottom: 0; width: 30%; height: 80%; border-radius: 6px 6px 0 0; background: var(--art-object, #0d6e64); }
    .frame-thumb span { position: absolute; z-index: 2; left: 9px; top: 8px; width: 53%; color: var(--art-ink, #203a35); font: 700 9px/1.35 Georgia, serif; }
    .carousel-action-hint { min-height: 28px; display: flex; align-items: center; justify-content: center; padding: 7px 12px; color: var(--muted); font-size: 9px; text-align: center; }

    .state-console { margin-top: 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .state-console summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 15px; cursor: pointer; font-size: 11px; font-weight: 750; }
    .state-console summary::after { content: "+"; color: var(--green); font-size: 18px; }
    .state-console[open] summary::after { content: "−"; }
    .console-body { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0 15px 15px; border-top: 1px solid var(--line); }
    .console-column { padding-top: 14px; }
    .console-column h3 { margin: 0 0 9px; font-size: 10px; }
    .event-log { min-height: 48px; padding: 10px; border-radius: 6px; color: #dce9e6; background: #263532; font: 9px/1.55 Consolas, monospace; overflow-wrap: anywhere; }
    .scenario-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
    .scenario-tabs button { min-height: 29px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: #fff; font-size: 9px; }
    .scenario-tabs button.active { color: var(--green-dark); border-color: #8fc7be; background: var(--mint); }
    .scenario-copy { min-height: 48px; margin: 0; color: var(--muted); font-size: 9px; line-height: 1.6; }
    .scenario-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .scenario-actions button { min-height: 30px; padding: 5px 8px; border: 1px solid #9bc4bb; border-radius: 6px; color: var(--green-dark); background: #fff; font-size: 9px; }

    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 7px; color: #fff; background: #263532; box-shadow: 0 9px 30px rgba(16, 34, 30, .22); opacity: 0; pointer-events: none; transform: translate(-50%, 10px); transition: opacity .16s ease, transform .16s ease; font-size: 10px; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: #8c3933; }

    @media (max-width: 1040px) {
      .results { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .topbar { position: static; padding: 10px 14px; }
      .preview-badge { font-size: 9px; }
      .shell { padding: 18px 14px 42px; }
      .page-heading { align-items: flex-start; flex-direction: column; gap: 9px; }
      h1 { font-size: 23px; }
      .zero-network { white-space: normal; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .sidebar.surface { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .sidebar-section { padding: 0 0 14px; }
      .sidebar-section:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); }
      .sidebar-section:last-child { grid-column: 1 / -1; padding: 0; border: 0; }
      .results, .results.narrative-results { grid-template-columns: 1fr; }
      .console-body { grid-template-columns: 1fr; }
    }

    @media (max-width: 430px) {
      .brand small { display: none; }
      .preview-badge { max-width: 122px; text-align: right; }
      .sidebar.surface { grid-template-columns: 1fr; }
      .sidebar-section, .sidebar-section:nth-child(even) { padding: 0 0 14px; border: 0; border-bottom: 1px solid var(--line); }
      .sidebar-section:last-child { padding: 0; border: 0; }
      .results-header { align-items: flex-start; }
      .result-card { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div><strong>辅助创意工具</strong><small>CREATIVE ASSISTANT</small></div>
    </div>
    <div class="preview-badge">一次性前端预览 · 无真实 AI 请求</div>
  </header>

  <main class="shell">
    <header class="page-heading">
      <div>
        <div class="eyebrow">TEXT FIRST · ON-DEMAND IMAGE</div>
        <h1>先看文字，再决定是否生成图片</h1>
        <p>本页只验证新流程的结果形态与图片状态，不验证 Prompt 和图片质量。</p>
      </div>
      <div class="zero-network">本地假数据 · 不读取生产页面、旧 AI、接口或数据库</div>
    </header>

    <div class="workspace">
      <aside class="sidebar surface" aria-label="预览控制">
        <section class="sidebar-section">
          <span class="label">广告类型</span>
          <div class="segmented" id="modeControls">
            <button type="button" data-mode="narrative">叙事类</button>
            <button type="button" data-mode="visual">展示类</button>
          </div>
          <div class="segmented submode" id="visualModeControls">
            <button type="button" data-visual-mode="static">静态创意</button>
            <button type="button" data-visual-mode="carousel">轮播创意</button>
          </div>
        </section>

        <section class="sidebar-section">
          <span class="label">本次任务</span>
          <div class="brief-list">
            <div class="brief-row"><span>任务说明</span><strong>突出轻松上手与长期成长</strong></div>
            <div class="brief-row"><span>画面比例</span><strong>16:9</strong></div>
          </div>
          <div class="tag-list" aria-label="已选创意标签"><span>年轻上班族</span><span>成长反馈</span><span>东方幻想</span></div>
        </section>

        <section class="sidebar-section" id="simulationControls">
          <span class="label">图片结果模拟</span>
          <div class="segmented outcome">
            <button type="button" data-outcome="success">下次成功</button>
            <button type="button" data-outcome="failure">下次失败</button>
          </div>
          <button class="reset-button" id="resetButton" type="button">重置当前预览</button>
        </section>

        <section class="sidebar-section isolation">
          <strong>新旧 AI 完全隔离</strong>
          <p>旧 AI 已冻结。新流程对旧流程零引用、零回退、零双写/双读，也不存在兼容映射串联。</p>
        </section>
      </aside>

      <section class="main" aria-live="polite">
        <header class="results-header">
          <div><h2 id="resultsTitle"></h2><p id="resultsSubtitle"></p></div>
          <div class="result-count" id="resultCount"></div>
        </header>
        <div class="results" id="results"></div>

        <details class="state-console">
          <summary>流程状态验证</summary>
          <div class="console-body">
            <section class="console-column">
              <h3>当前状态</h3>
              <div class="status-list" id="statusSummary"></div>
              <h3>最近一次变化</h3>
              <div class="event-log" id="eventLog"></div>
            </section>
            <section class="console-column">
              <h3>引导式演练</h3>
              <div class="scenario-tabs" id="scenarioTabs"></div>
              <p class="scenario-copy" id="scenarioCopy"></p>
              <div class="scenario-actions" id="scenarioActions"></div>
            </section>
          </div>
        </details>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const copy = (value) => JSON.parse(JSON.stringify(value));
    const IMAGE_STATES = Object.freeze(["pending", "generating", "success", "failed"]);

    const content = Object.freeze({
      narrative: [
        { story: "加班到深夜的普通人误入一座会回应情绪的东方幻想城，在一次次微小胜利中重新找回掌控感。", hooks: [
          { text: "如果你的疲惫能变成一座城，它今晚会是什么样？", scenes: ["写字楼只剩一盏灯，电脑进度条停在 99%。", "杯中倒影忽然长出青石街与灯笼，主角伸手触碰。", "手指越过水面，城市在掌心亮起第一盏回应他的灯。"] },
          { text: "他只想休息五分钟，却在五分钟里成为了另一个世界的城主。", scenes: ["手机倒计时从 05:00 开始，主角靠在椅背闭眼。", "睁眼后站在空旷城门前，系统只显示一项简单任务。", "完成第一次建造，现实桌面的盆栽同步长出一片新叶。"] }
        ]},
        { story: "一名总是错过朋友邀约的新手玩家，用每天十分钟经营出一支跨越昼夜的冒险队伍。", hooks: [
          { text: "朋友都满级了，他的第一支队伍却在替他等下班。", scenes: ["群聊不断弹出通关截图，主角在地铁里匆匆划过。", "游戏中的三名伙伴坐在篝火边，身旁留着一个空位。", "主角上线，伙伴起身，积累一天的资源同时展开。"] },
          { text: "没有追赶全服，他只追上了属于自己的节奏。", scenes: ["排行榜飞速滚动，主角把它轻轻收起。", "镜头转向个人领地，新建筑按日程逐一完成。", "清晨通勤时，他领取昨夜成长，队伍向新地图出发。"] }
        ]},
        { story: "被工作磨平想象力的设计师，在碎片时间里培养一只会替主人收集灵感的幻想生物。", hooks: [
          { text: "她画不出的那一笔，被屏幕里的小家伙捡了回来。", scenes: ["空白画布中央只有一条被撤销多次的曲线。", "幻想生物从游戏森林捧回一枚发光种子。", "种子化作色彩落入现实画布，完整构图随之展开。"] },
          { text: "离线八小时，它为她收藏了八次想放弃的理由。", scenes: ["主角关闭游戏，办公室灯光从白天变到夜晚。", "幻想生物穿过四季场景，收集不同颜色的光点。", "再次上线，光点拼成一句简短留言与一整页奖励。"] }
        ]},
        { story: "一对生活在不同时区的朋友，用共同建设的浮空庭院维持每天一次的默契。", hooks: [
          { text: "他们很久没有同时在线，花园却每天都在替彼此说早安。", scenes: ["左侧城市迎来清晨，右侧城市正沉入夜色。", "一人种下树苗离线，另一人上线时为它挂上风铃。", "镜头拉远，浮空庭院由两种时间的光线共同照亮。"] },

      ],
      staticItems: [
        { title: "十分钟，也能看见成长", coreIdea: "用现实通勤的一小段时间，对照角色清晰可见的长期成长。", adCopy: "不追时间，也能一步步变强。", description: "清晨地铁车厢中，主角单手握住手机；屏幕内角色沿发光阶梯向上，每一级都留下装备与伙伴成长的清晰刻度。", art: ["#dfece8", "#087f73", "#21433e"] },
        { title: "你的队伍一直在等你", coreIdea: "把离线成长表现为伙伴替玩家守住进度，而不是冰冷的数字累积。", adCopy: "忙你的，冒险不会把你落下。", description: "东方幻想营地的黄昏，三名伙伴围坐篝火并为镜头前留出空位；远处资源车正缓缓归来。", art: ["#f4e7d3", "#b76842", "#4b3226"] },
        { title: "复杂世界，一条路就够", coreIdea: "把庞大玩法收束为一条由当前目标点亮的路径，传达易上手。", adCopy: "想做什么，世界就为你亮哪里。", description: "俯瞰层叠的东方城镇，其他道路安静隐去，只有一条青绿色路径从人物脚下通向远处明亮城门。", art: ["#e4e9ef", "#376b8d", "#283e50"] }
      ],
      carouselItems: [
        { title: "下班后的十分钟", coreIdea: "四张画面完成从疲惫现实到轻松成长的连续转场。", adCopy: "十分钟，接回属于你的冒险。", art: ["#dfece8", "#087f73", "#21433e"], frames: ["写字楼深夜，主角合上电脑，手机显示 22:40。", "地铁启动，游戏队伍在篝火旁迎接主角上线。", "主角完成一次轻量操作，角色和装备连续升级。", "到站提示响起，手机中的新城门打开，文案落版。"] },
        { title: "伙伴替你守住进度", coreIdea: "用伙伴行动串联离线积累、回归领取与下一次出发。", adCopy: "你不在线，他们也在向前。", art: ["#f4e7d3", "#b76842", "#4b3226"], frames: ["主角挥手离开营地，伙伴目送他走入现实通勤人潮。", "伙伴分别采集、锻造和探索，营地物资逐渐充盈。", "主角再次上线，伙伴把收获摆满长桌。", "全员走向新地图，队伍背影与品牌信息同时出现。"] },
        { title: "只点亮今天的目标", coreIdea: "逐张减少信息噪音，让复杂世界主动变得清晰。", adCopy: "不用全懂，先赢今天这一件事。", art: ["#e4e9ef", "#376b8d", "#283e50"], frames: ["繁多玩法图标围绕人物展开，人物略显迟疑。", "人物选择“装备进阶”，无关图标逐一收起。", "唯一任务路径点亮，奖励节点按顺序出现。", "装备升级完成，清晰的下一目标在远处亮起。"] }
      ]
    });

    function createInitialState() {
      return {
        mode: "visual",
        visualMode: "static",
        outcome: "success",
        staticStates: content.staticItems.map(() => "pending"),
        carouselStates: content.carouselItems.map((item) => item.frames.map(() => "pending")),
        scenario: "static-lock",
        lastEvent: "预览已就绪：展示类 / 静态创意，所有图片均未生成。"
      };
    }

    function isKnownImageState(value) {
      return IMAGE_STATES.includes(value);
    }

    function firstUnfinishedFrame(states) {
      return states.findIndex((status) => status !== "success");
    }

    function reduce(current, action) {
      const next = copy(current);
      const reject = (reason) => ({ ...current, lastEvent: `操作未执行：${reason}` });

      if (action.type === "SELECT_MODE") {
        if (!["narrative", "visual"].includes(action.mode)) return reject("未知广告类型");
        next.mode = action.mode;
        next.lastEvent = action.mode === "narrative" ? "已切换到叙事类文字方案。" : "已切换到展示类方案。";
        return next;
      }
      if (action.type === "SELECT_VISUAL_MODE") {
        if (!["static", "carousel"].includes(action.visualMode)) return reject("未知展示模式");
        next.mode = "visual";
        next.visualMode = action.visualMode;
        next.lastEvent = action.visualMode === "static" ? "展示类已切换为静态创意。" : "展示类已切换为轮播创意。";
        return next;
      }
      if (action.type === "SET_OUTCOME") {
        if (!["success", "failure"].includes(action.outcome)) return reject("未知模拟结果");
        next.outcome = action.outcome;
        next.lastEvent = `下一次图片生成将模拟${action.outcome === "success" ? "成功" : "失败"}。`;
        return next;
      }
      if (action.type === "SELECT_SCENARIO") {
        next.scenario = action.scenario;
        next.lastEvent = "已切换引导式演练，业务状态未改变。";
        return next;
      }
      if (action.type === "RESET_PREVIEW") {
        const reset = createInitialState();
        reset.mode = current.mode;
        reset.visualMode = current.visualMode;
        reset.scenario = current.scenario;
        reset.lastEvent = "当前预览已重置，所有模拟图片恢复为未生成。";
        return reset;
      }

      if (action.target === "static") {
        const status = current.staticStates[action.itemIndex];
        if (!isKnownImageState(status)) return reject("静态方案不存在");
        if (action.type === "START_IMAGE") {
          if (status === "success") return reject("成功图片已锁定，不可重新生成");
          if (status === "generating") return reject("图片正在生成，请等待本次完成");
          next.staticStates[action.itemIndex] = "generating";
          next.lastEvent = `静态方案 ${action.itemIndex + 1} 开始生成唯一图片。`;
          return next;
        }
        if (status !== "generating") return reject("当前图片没有进行中的生成任务");
        next.staticStates[action.itemIndex] = action.type === "COMPLETE_IMAGE" ? "success" : "failed";
        next.lastEvent = action.type === "COMPLETE_IMAGE"
          ? `静态方案 ${action.itemIndex + 1} 生成成功并永久锁定。`
          : `静态方案 ${action.itemIndex + 1} 生成失败，可以重试同一张。`;
        return next;
      }

      if (action.target === "carousel") {
        const states = current.carouselStates[action.itemIndex];
        if (!states || !isKnownImageState(states[action.frameIndex])) return reject("轮播画面不存在");
        const expectedIndex = firstUnfinishedFrame(states);
        const status = states[action.frameIndex];
        if (action.type === "START_IMAGE") {
          if (status === "success") return reject("该画面已锁定，不可重新生成");
          if (action.frameIndex !== expectedIndex) return reject(`必须先完成第 ${expectedIndex + 1} 张`);
          if (status === "generating") return reject("当前画面正在生成，请等待本次完成");
          next.carouselStates[action.itemIndex][action.frameIndex] = "generating";
          next.lastEvent = `轮播方案 ${action.itemIndex + 1} 开始生成第 ${action.frameIndex + 1} 张；只使用前一张实际图片和本张既定指令。`;
          return next;
        }
        if (status !== "generating") return reject("当前画面没有进行中的生成任务");
        next.carouselStates[action.itemIndex][action.frameIndex] = action.type === "COMPLETE_IMAGE" ? "success" : "failed";
        next.lastEvent = action.type === "COMPLETE_IMAGE"
          ? `轮播方案 ${action.itemIndex + 1} 第 ${action.frameIndex + 1} 张生成成功并锁定，下一张已解锁。`
          : `轮播方案 ${action.itemIndex + 1} 第 ${action.frameIndex + 1} 张失败，只允许重试这一张。`;
        return next;
      }

      return reject("当前动作不属于新流程");
    }

    function deriveFrameAvailability(states) {
      const nextIndex = firstUnfinishedFrame(states);
      return states.map((status, index) => ({
        status,
        canGenerate: index === nextIndex && (status === "pending" || status === "failed"),
        locked: status === "success",
        blocked: index > nextIndex
      }));
    }

    let state = createInitialState();
    let toastTimer = null;

    const dom = {
      modeControls: document.querySelector("#modeControls"),
      visualModeControls: document.querySelector("#visualModeControls"),
      simulationControls: document.querySelector("#simulationControls"),
      resetButton: document.querySelector("#resetButton"),
      resultsTitle: document.querySelector("#resultsTitle"),
      resultsSubtitle: document.querySelector("#resultsSubtitle"),
      resultCount: document.querySelector("#resultCount"),
      results: document.querySelector("#results"),
      statusSummary: document.querySelector("#statusSummary"),
      eventLog: document.querySelector("#eventLog"),
      scenarioTabs: document.querySelector("#scenarioTabs"),
      scenarioCopy: document.querySelector("#scenarioCopy"),
      scenarioActions: document.querySelector("#scenarioActions"),
      toast: document.querySelector("#toast")
    };

    const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" }[char]));
    const artStyle = (art) => `--art-bg:${art[0]};--art-object:${art[1]};--art-ink:${art[2]}`;

    function imageStatusLabel(status) {
      return ({ pending: "未生成", generating: "生成中", success: "已锁定", failed: "生成失败" })[status];
    }

    function showToast(message, isError = false) {
      clearTimeout(toastTimer);
      dom.toast.textContent = message;
      dom.toast.className = `toast show${isError ? " error" : ""}`;
      toastTimer = setTimeout(() => { dom.toast.className = "toast"; }, 2200);
    }

    function dispatch(action) {
      const before = state;
      state = reduce(state, action);
      render();
      const rejected = state.lastEvent.startsWith("操作未执行");
      if (rejected) showToast(state.lastEvent, true);

      if (action.type === "START_IMAGE" && !rejected && before !== state) {
        const completion = state.outcome === "success" ? "COMPLETE_IMAGE" : "FAIL_IMAGE";
        setTimeout(() => {
          const statuses = action.target === "static" ? state.staticStates : state.carouselStates[action.itemIndex];
          const currentStatus = action.target === "static" ? statuses[action.itemIndex] : statuses[action.frameIndex];
          if (currentStatus === "generating") dispatch({ ...action, type: completion });
        }, 760);
      }
    }

    function renderNarrativeCard(item, index) {
      return `<article class="result-card">
        <header class="card-head"><span class="card-kicker">故事方案 ${index + 1}</span><h3>${esc(item.story)}</h3></header>
        <div class="card-body">${item.hooks.map((hook, hookIndex) => `<section class="hook"><strong>钩子 ${hookIndex + 1} · ${esc(hook.text)}</strong><ol class="scene-list">${hook.scenes.map((scene) => `<li>${esc(scene)}</li>`).join("")}</ol></section>`).join("")}</div>
      </article>`;
    }

    function renderImageZone(item, index, status) {
      if (status === "success") {
        return `<div class="image-zone"><div class="simulated-art" style="${artStyle(item.art)}"><div class="art-copy">${esc(item.adCopy)}<small>模拟图片 · 不代表最终视觉质量</small></div><span class="lock-label">已生成 · 不可重生成</span></div><div class="image-actions"><button class="action-button locked" type="button" disabled>✓ 图片已锁定</button></div></div>`;
      }
      const isGenerating = status === "generating";
      const isFailed = status === "failed";
      return `<div class="image-zone"><div class="image-placeholder">${isGenerating ? `<div><div class="spinner" aria-hidden="true"></div><p>正在生成这一张图片…</p></div>` : `<div><span class="placeholder-icon" aria-hidden="true">▧</span><strong>${isFailed ? "本次生成失败" : "图片尚未生成"}</strong><p>${isFailed ? "可重试；成功后才会锁定" : "文字方案不自动附带图片"}</p></div>`}</div><div class="image-actions"><button class="action-button${isFailed ? " retry" : ""}" type="button" data-generate-static="${index}" ${isGenerating ? "disabled" : ""}>${isGenerating ? "生成中…" : isFailed ? "↻ 重试生成图片" : "＋ 生成一张图片"}</button></div></div>`;
    }

    function renderStaticCard(item, index) {
      return `<article class="result-card">
        <header class="card-head"><span class="card-kicker">静态方案 ${index + 1}</span><h3>${esc(item.title)}</h3></header>
        <div class="card-body"><dl>
          <div class="field"><dt>核心创意</dt><dd>${esc(item.coreIdea)}</dd></div>
          <div class="field"><dt>广告文案</dt><dd class="ad-copy">${esc(item.adCopy)}</dd></div>
          <div class="field"><dt>画面描述</dt><dd>${esc(item.description)}</dd></div>
        </dl></div>${renderImageZone(item, index, state.staticStates[index])}
      </article>`;
    }

    function renderCarouselCard(item, itemIndex) {
      const availability = deriveFrameAvailability(state.carouselStates[itemIndex]);
      const activeIndex = availability.findIndex((frame) => frame.canGenerate || frame.status === "generating");
      const allDone = availability.every((frame) => frame.status === "success");
      const activeFrame = activeIndex >= 0 ? availability[activeIndex] : null;
      const buttonLabel = activeFrame?.status === "generating" ? `第 ${activeIndex + 1} 张生成中…` : activeFrame?.status === "failed" ? `↻ 重试第 ${activeIndex + 1} 张` : `＋ 生成第 ${activeIndex + 1} 张`;
      return `<article class="result-card">
        <header class="card-head"><span class="card-kicker">轮播方案 ${itemIndex + 1}</span><h3>${esc(item.title)}</h3></header>
        <div class="card-body"><dl>
          <div class="field"><dt>核心创意</dt><dd>${esc(item.coreIdea)}</dd></div>
          <div class="field"><dt>广告文案</dt><dd class="ad-copy">${esc(item.adCopy)}</dd></div>
          <div class="field"><dt>后续画面描述</dt><dd><div class="frame-list">${item.frames.map((description, frameIndex) => {
            const frame = availability[frameIndex];
            return `<div class="frame-row"><span class="frame-index">${frameIndex + 1}</span><p>${esc(description)}</p><span class="frame-state ${frame.status}">${imageStatusLabel(frame.status)}</span>${frame.status === "success" ? `<div class="frame-thumb" style="${artStyle(item.art)}"><span>第 ${frameIndex + 1} 张模拟图片</span></div>` : ""}</div>`;
          }).join("")}</div></dd></div>
        </dl></div>
        <div class="image-zone"><div class="carousel-action-hint">${allDone ? "本方案全部图片已生成并锁定" : activeFrame?.status === "failed" ? "失败只影响当前张，后续仍保持锁定" : activeIndex === 0 ? "先生成首张；后续将按顺序逐张解锁" : `第 ${activeIndex + 1} 张将携带第 ${activeIndex} 张实际图片生成`}</div><div class="image-actions"><button class="action-button${activeFrame?.status === "failed" ? " retry" : allDone ? " locked" : ""}" type="button" ${allDone || activeFrame?.status === "generating" ? "disabled" : ""} data-generate-carousel="${itemIndex}" data-frame-index="${Math.max(activeIndex, 0)}">${allDone ? "✓ 全部图片已锁定" : buttonLabel}</button></div></div>
      </article>`;
    }

    const scenarios = Object.freeze({
      "static-lock": {
        label: "静态锁定",
        copy: "按顺序点击：切换静态、设置成功、生成第 1 套，再尝试重复生成。最后一步应被拒绝。",
        actions: [
          ["打开静态方案", { type: "SELECT_VISUAL_MODE", visualMode: "static" }],
          ["设置下次成功", { type: "SET_OUTCOME", outcome: "success" }],
          ["生成第 1 套", { type: "START_IMAGE", target: "static", itemIndex: 0 }],
          ["再次生成第 1 套", { type: "START_IMAGE", target: "static", itemIndex: 0 }]
        ]
      },
      "carousel-order": {
        label: "轮播顺序",
        copy: "先打开轮播并生成第 1 张。成功前直接请求第 2 张会被拒绝；成功后页面只开放第 2 张。",
        actions: [
          ["打开轮播方案", { type: "SELECT_VISUAL_MODE", visualMode: "carousel" }],
          ["生成方案 1 第 1 张", { type: "START_IMAGE", target: "carousel", itemIndex: 0, frameIndex: 0 }],
          ["越过顺序生成第 2 张", { type: "START_IMAGE", target: "carousel", itemIndex: 0, frameIndex: 1 }]
        ]
      },
      "carousel-retry": {
        label: "失败重试",
        copy: "设置失败后生成首张，失败状态不会解锁后续；改为成功并重试同一张，成功后才开放下一张。",
        actions: [
          ["打开轮播方案", { type: "SELECT_VISUAL_MODE", visualMode: "carousel" }],
          ["设置下次失败", { type: "SET_OUTCOME", outcome: "failure" }],
          ["生成方案 2 第 1 张", { type: "START_IMAGE", target: "carousel", itemIndex: 1, frameIndex: 0 }],
          ["设置下次成功", { type: "SET_OUTCOME", outcome: "success" }],
          ["重试方案 2 第 1 张", { type: "START_IMAGE", target: "carousel", itemIndex: 1, frameIndex: 0 }]
        ]
      }
    });

    function renderStatusConsole() {
      const staticCounts = Object.fromEntries(IMAGE_STATES.map((status) => [status, state.staticStates.filter((value) => value === status).length]));
      const flatCarousel = state.carouselStates.flat();
      const carouselCounts = Object.fromEntries(IMAGE_STATES.map((status) => [status, flatCarousel.filter((value) => value === status).length]));
      dom.statusSummary.innerHTML = `
        <div class="status-row"><span>当前入口</span><strong>${state.mode === "narrative" ? "叙事类" : `展示类 / ${state.visualMode === "static" ? "静态" : "轮播"}`}</strong></div>
        <div class="status-row"><span>静态图片</span><strong>${staticCounts.success} 已锁定 · ${staticCounts.failed} 失败 · ${staticCounts.generating} 生成中</strong></div>
        <div class="status-row"><span>轮播画面</span><strong>${carouselCounts.success} 已锁定 · ${carouselCounts.failed} 失败 · ${carouselCounts.generating} 生成中</strong></div>
        <div class="status-row"><span>业务请求</span><strong>0</strong></div>`;
      dom.eventLog.textContent = state.lastEvent;
      dom.scenarioTabs.innerHTML = Object.entries(scenarios).map(([key, scenario]) => `<button type="button" data-scenario="${key}" class="${state.scenario === key ? "active" : ""}">${esc(scenario.label)}</button>`).join("");
      const scenario = scenarios[state.scenario];
      dom.scenarioCopy.textContent = scenario.copy;
      dom.scenarioActions.innerHTML = scenario.actions.map(([label], index) => `<button type="button" data-scenario-action="${index}">${esc(label)}</button>`).join("");
    }

    function render() {
      dom.modeControls.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button.dataset.mode === state.mode));
      dom.visualModeControls.hidden = state.mode !== "visual";
      dom.visualModeControls.querySelectorAll("button").forEach((button) => button.classList.toggle("active", button.dataset.visualMode === state.visualMode));
      dom.simulationControls.hidden = state.mode !== "visual";
      dom.simulationControls.querySelectorAll("[data-outcome]").forEach((button) => button.classList.toggle("active", button.dataset.outcome === state.outcome));

      if (state.mode === "narrative") {
        dom.resultsTitle.textContent = "叙事类文字方案";
        dom.resultsSubtitle.textContent = "每套 1 个故事、2 个钩子、6 个画面描述；不提供图片。";
        dom.resultCount.textContent = "共 5 套";
        dom.results.className = "results narrative-results";
        dom.results.innerHTML = content.narrative.map(renderNarrativeCard).join("");
      } else if (state.visualMode === "static") {
        dom.resultsTitle.textContent = "展示类 · 静态创意";
        dom.resultsSubtitle.textContent = "先提供完整文字，认可后每套最多生成 1 张图片。";
        dom.resultCount.textContent = "共 3 套";
        dom.results.className = "results";
        dom.results.innerHTML = content.staticItems.map(renderStaticCard).join("");
      } else {
        dom.resultsTitle.textContent = "展示类 · 轮播创意";
        dom.resultsSubtitle.textContent = "一次给出完整文字路线；每次点击只生成下一张。";
        dom.resultCount.textContent = "共 3 套 · 每套 4 张";
        dom.results.className = "results";
        dom.results.innerHTML = content.carouselItems.map(renderCarouselCard).join("");
      }
      renderStatusConsole();
    }

    document.addEventListener("click", (event) => {
      const modeButton = event.target.closest("[data-mode]");
      if (modeButton) return dispatch({ type: "SELECT_MODE", mode: modeButton.dataset.mode });
      const visualModeButton = event.target.closest("[data-visual-mode]");
      if (visualModeButton) return dispatch({ type: "SELECT_VISUAL_MODE", visualMode: visualModeButton.dataset.visualMode });
      const outcomeButton = event.target.closest("[data-outcome]");
      if (outcomeButton) return dispatch({ type: "SET_OUTCOME", outcome: outcomeButton.dataset.outcome });
      const staticButton = event.target.closest("[data-generate-static]");
      if (staticButton) return dispatch({ type: "START_IMAGE", target: "static", itemIndex: Number(staticButton.dataset.generateStatic) });
      const carouselButton = event.target.closest("[data-generate-carousel]");
      if (carouselButton) return dispatch({ type: "START_IMAGE", target: "carousel", itemIndex: Number(carouselButton.dataset.generateCarousel), frameIndex: Number(carouselButton.dataset.frameIndex) });
      const scenarioButton = event.target.closest("[data-scenario]");
      if (scenarioButton) return dispatch({ type: "SELECT_SCENARIO", scenario: scenarioButton.dataset.scenario });
      const scenarioAction = event.target.closest("[data-scenario-action]");
      if (scenarioAction) return dispatch(copy(scenarios[state.scenario].actions[Number(scenarioAction.dataset.scenarioAction)][1]));
    });
    dom.resetButton.addEventListener("click", () => dispatch({ type: "RESET_PREVIEW" }));

    render();
  </script>
</body>
</html>
